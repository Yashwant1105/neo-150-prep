name: mins_prep

description: A dark-mode coding interview progression companion for NeetCode 150.

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_riverpod: ^2.6.1
  web: ^1.1.1
  supabase_flutter: ^2.8.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.4
  flutter_svg: ^2.2.0
  share_plus: ^12.0.2
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/neetcode150.json
    - assets/icons/core/
    - assets/icons/achievements/
    - assets/icons/topics/